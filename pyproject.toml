[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finnews-sentiment"
version = "0.1.0"
description = "Financial news sentiment classification mini-product"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<1",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0,<2",
]

data = [
    "datasets>=3.0,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
